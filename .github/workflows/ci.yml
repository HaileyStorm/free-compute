name: CI

on:
  workflow_dispatch:
    inputs:
      hosted_credit_warning:
        description: "Hosted Actions credits are nearly exhausted. Type RUN HOSTED CI to confirm this spend."
        required: true
        default: "DO NOT RUN"

permissions:
  contents: read

jobs:
  test:
    if: ${{ inputs.hosted_credit_warning == 'RUN HOSTED CI' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate public catalog
        run: python scripts/validate_catalog.py
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Check browser JavaScript
        run: node --check app.js
